name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned. Bumping GITLEAKS_VERSION requires updating GITLEAKS_SHA256 in the
      # same commit; the checksum is for the 8.30.1 linux-x64 release archive.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the repository history
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
      # Guard for the single-rule exemption above: proves other rules still fire
      # on the exempt path and generic-api-key still fires everywhere else.
      - name: "Regression test: planted secrets are detected"
        run: bash .github/scripts/secret-scan-selftest.sh ./gitleaks

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
