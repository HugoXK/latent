name: review-gate

# The required check is `review-gate`, created by the script on the pull request
# head SHA. The job name is `review-gate-runner` so the job's own status is not
# confused with the required context.
#
# Commit comments do not trigger a workflow, so a scheduled run repaints the
# open pull requests. The same script also runs on review and comment events, and
# can be dispatched manually.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number (empty = every open pull request)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-gate-runner:
    name: review-gate-runner
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The base ref, never the pull request head: a pull request that edits the
      # gate must not be the thing that judges its own tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require the reviewer PASS at the tip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEWER_LOGIN: HugoXK-bot
          PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr || '' }}
        run: |
          if [ ! -f .github/scripts/review_gate.py ]; then
            echo "review-gate: bootstrap (script is not on the base branch yet)"
            exit 0
          fi
          python3 .github/scripts/review_gate.py
