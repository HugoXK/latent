name: ci-ok

# Publish the required `ci-ok` context from the default branch. A pull request
# can edit its own ci.yml and weaken the in-workflow aggregate; this publisher
# reads the triggering run's jobs and requires the exact set (spec, node,
# gate-tests) before creating a green check on the head SHA.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: ci-ok-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  publish:
    name: ci-ok-publisher
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always the default branch: the publisher must not execute the pull
      # request's copy of this script.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Publish ci-ok
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 .github/scripts/ci_ok_publish.py
