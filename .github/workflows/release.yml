name: release

# Manual, two-phase release. `prepare` opens a mechanical release PR; after it
# merges, `publish` tags the verified green main commit, attaches an SBOM and a
# source archive, and `attest` mints provenance. Never release from a red main.
#
# Permissions are per job: `verify` is read-only, and the write scopes
# (contents/id-token/attestations) exist only on the jobs that publish or attest.
# Every action is pinned to a full commit SHA because these jobs hold write
# scopes and tag refs resolve to whatever the action repository points at.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare a release PR or publish a tagged release"
        required: true
        type: choice
        options: [prepare, publish]
        default: prepare
      version:
        description: "semantic version, e.g. 0.3.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.green.outputs.sha }}
    steps:
      - name: Require a green main
        id: green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          SHA=$(gh run list --branch main --workflow ci --limit 1 --json headSha,conclusion --jq '.[0].headSha // empty')
          CONCLUSION=$(gh run list --branch main --workflow ci --limit 1 --json conclusion --jq '.[0].conclusion // empty')
          echo "main head $SHA: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "release refused: main is not green"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.green.outputs.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Verify the workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          python3 -m unittest discover -s .github/scripts -p "test_*.py"

  prepare:
    name: prepare
    needs: verify
    if: inputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      # A PR opened with GITHUB_TOKEN does not trigger ci/pr-lint, so its release
      # PR would never get the required checks. Push the branch always; open the
      # PR only when a token that triggers workflows (RELEASE_PR_TOKEN) exists,
      # otherwise print the compare URL for a human to open it.
      - name: Prepare the release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/release.py --version "$VERSION" --write
          git config user.name "HugoXK-bot"
          git config user.email "87640074+HugoXK@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git add -A
          git commit -m "chore(release): v$VERSION"
          git push origin "HEAD:release/v$VERSION"
          if [ "$HAS_PR_TOKEN" != "true" ]; then
            echo "no RELEASE_PR_TOKEN: branch pushed, PR not created."
            echo "open it manually so ci/pr-lint/review-gate run:"
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/main...release/v$VERSION?expand=1"
            exit 0
          fi
          gh pr create --base main --head "release/v$VERSION" \
            --title "chore(release): v$VERSION" \
            --body "No-issue: release v$VERSION

          ## What and why

          Mechanical release: fold \`changelog.d/\` into \`CHANGELOG.md\` and bump the
          workspace versions to $VERSION.

          ## Evidence

          Ran: \`python3 .github/scripts/release.py --version $VERSION --write\` and
          \`pnpm check\` in the release workflow.
          Not run: the tag/publish step; dispatch \`release\` with mode=publish after
          this pull request merges.

          ## Risk tier

          - [x] T2

          Changelog-not-needed: the release folds the existing fragments."

  publish:
    name: publish
    needs: [verify, prepare]
    if: inputs.mode == 'publish' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          version: 11.1.2

      - name: Build the SBOM, archive and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          EXTRA=$(find changelog.d -maxdepth 1 -name '*.md' ! -name README.md -print)
          if [ -n "$EXTRA" ]; then
            echo "release refused: changelog fragments remain: $EXTRA"
            exit 1
          fi
          python3 .github/scripts/release.py --version "$VERSION" --notes > /tmp/notes.md
          python3 - <<'PY'
          import json, os, sys
          version = os.environ["VERSION"]
          current = json.load(open("package.json", encoding="utf-8"))["version"]
          if current != version:
              print(f"release refused: package.json is {current}, expected {version}")
              sys.exit(1)
          PY
          pnpm list --json --depth Infinity > /tmp/pnpm-list.json
          python3 .github/scripts/sbom.py \
            --input /tmp/pnpm-list.json \
            --output sbom.json \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git archive --format=tar.gz --prefix="latent-$VERSION/" \
            -o "latent-$VERSION.tar.gz" "${{ needs.verify.outputs.sha }}"
          gh release create "v$VERSION" \
            --target "${{ needs.verify.outputs.sha }}" \
            --title "v$VERSION" \
            --notes-file /tmp/notes.md
          gh release upload "v$VERSION" sbom.json "latent-$VERSION.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archive
          path: latent-${{ inputs.version }}.tar.gz

  attest:
    name: attest
    needs: [verify, publish]
    if: inputs.mode == 'publish' && needs.verify.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archive

      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: latent-${{ inputs.version }}.tar.gz
